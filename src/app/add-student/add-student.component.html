<div class="add-student-form">
  <h2>Add Student</h2>
  <form [formGroup]="student" (ngSubmit)="handleSubmit()">
    <div class="form-group">
      <label for="studentName">Name:</label>
      <input type="text" id="studentName" formControlName="name" required>
      <div *ngIf="student.get('name')?.invalid && student.get('name')?.touched" class="error">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="age">Age:</label>
      <input type="number" id="age" formControlName="age" required>
      <div *ngIf="student.get('age')?.invalid && student.get('age')?.touched" class="error">
        Age is required and must be greater than 0.
      </div>
    </div>

    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender" formControlName="gender" required>
        <option value="" disabled>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <div *ngIf="student.get('gender')?.invalid && student.get('gender')?.touched" class="error">
        Gender is required.
      </div>
    </div>

    <div class="form-group">
      <label for="schoolId">School ID:</label>
      <input type="number" id="schoolId" formControlName="schoolId">
    </div>

    <button type="submit" [disabled]="student.invalid">Add Student</button>
  </form>

  <!-- Success message -->
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
</div>
