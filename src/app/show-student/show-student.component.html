<div class="student-container">
  <div class="student-list">
    <h2>Student List</h2>

    <!-- Search Field -->
    <div class="search-container">
      <input
        type="text"
        placeholder="Search by name..."
        [(ngModel)]="searchTerm"
        (input)="searchStudents()"
      />
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Gender</th>
          <th>School ID</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of filteredStudents">
          <td>{{ student.id }}</td>
          <td>{{ student.name }}</td>
          <td>{{ student.age }}</td>
          <td>{{ student.gender }}</td>
          <td>{{ student.schoolId }}</td>
          <td class="action-buttons">
            <button class="edit" (click)="editStudent(student.id)">Edit</button>
            <button class="delete" (click)="deleteStudent(student.id)">Delete</button>
            <button class="profile" (click)="showStudentProfile(student.id)">Profile</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  </div>
</div>
